<div class="pagetitle">
    <h1>Quản lý Mail</h1>
</div>

<!-- Button to open modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModaladd" data-bs-whatever="@mdo">
  <i class="bi bi-plus"></i> Thêm Mail
</button>

<!-- Modal for adding email -->
<div class="modal fade" id="exampleModaladd" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Thêm Mail</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form [formGroup]="addCategoryForm">
                    <div class="mb-3">
                        <label for="recipient-name" class="col-form-label">Tiêu đề mail:</label>
                        <input
                            type="text"
                            class="form-control"
                            id="recipient-name"
                            formControlName="subject" />
                    </div>
                    <div class="mb-3">
                        <label for="message-text" class="col-form-label">Nội dung mail:</label>
                        <textarea
                            class="form-control"
                            id="message-text"
                            formControlName="body"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="toEmails" class="col-form-label">Email Nhận:</label>
                        <select
                        class="form-control select2-multiple"
                        id="toEmails"
                        formControlName="toEmails"
                        multiple="multiple"
                        style="width: 100%;">
                        <option *ngFor="let contact of filteredContact" [value]="contact.email">{{ contact.email }}</option>
                      </select>
                      </div>
                      
                      
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Đóng
                </button>
                <button type="button" class="btn btn-primary" (click)="sendEmail()">
                    Gửi mail
                </button>
            </div>
        </div>
    </div>
</div>

<section class="section mt-3">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="row mb-3 search-input">
                        <div class="col-md-6">
                            <input type="text" class="form-control" placeholder="Tìm kiếm..." (input)="updateFilter($event)" />
                        </div>
                    </div>
                    <ngx-datatable class="material" [rows]="filteredCategories" [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50"  [rowHeight]="'auto'" [rowClass]="rowClassFunction" [limit]="5" [count]="filteredCategories.length" [offset]="offset"
                        (page)='onPage($event)'>
                        <ngx-datatable-column name="Tiêu đề mail">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                {{ row.subject }}
                            </ng-template>
                        </ngx-datatable-column>
                        <ngx-datatable-column name="Nội dung mail">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                {{ row.body }}
                            </ng-template>
                        </ngx-datatable-column>
                        <ngx-datatable-column name="Người nhận">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                {{ row.recipients }}
                            </ng-template>
                        </ngx-datatable-column>
                        <ngx-datatable-column name="Ngày gửi">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                {{ row.sentAt | date:'dd-MM-yyyy'}}
                            </ng-template>
                        </ngx-datatable-column>
                    </ngx-datatable>
                </div>
            </div>
        </div>
    </div>
</section>
